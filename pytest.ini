[pytest]
# Prefer: ./scripts/run_tests.sh   or   .venv/bin/python -m pytest
testpaths = tests
pythonpath = .
# Default: unit tests only. Integration: pytest -m integration
# All tests: pytest --override-ini addopts=
addopts = -m "not integration"
markers =
    integration: calls real LLM / network (requires OPENROUTER_API_KEY)
filterwarnings =
    ignore::DeprecationWarning
